name: Build APK

on:
  push:
    branches: [pushup-alarm]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE" -A3 build.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PushUpAlarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PushUpAlarm-apk
          path: PushUpAlarm.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pushup-alarm-build-${{ github.run_number }}
          name: PushUp Alarm build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: PushUpAlarm.apk
          body: Install PushUpAlarm.apk on your phone.
